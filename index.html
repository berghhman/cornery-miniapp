<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CORNERY | Магазин и лукбук</title>
<meta name="author" content="Дмитрий Бергхман">
<meta name="copyright" content="© 2026 Дмитрий Бергхман. Все права защищены.">
<meta name="description" content="CORNERY, магазин одежды в центре Москвы. Каталог, образы сезона, заказ через менеджера в Telegram.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<script id="tgjs" src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
:root{
  --bg:#f3f0ea; --surface:#fbfaf7; --card:#e9e4da; --ink:#141413; --ink-2:#3b3a37;
  --muted:#7a766e; --line:#dcd6cb; --accent:#a8412c; --ok:#3f6b4a;
  --dark:#121211; --dark-2:#1c1b1a; --dark-line:#2e2d2a; --dark-muted:#8f8a80;
  --r:14px; --r-sm:10px; --gut:16px;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --tabbar:64px;
  --shadow:0 18px 50px -20px rgba(20,20,19,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(243,240,234,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px;padding:0 var(--gut)}
.logo{font-weight:800;letter-spacing:.32em;font-size:17px;padding-left:.32em}
.nav{display:none;gap:26px;margin-left:36px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.nav a{opacity:.62;transition:opacity .2s}
.nav a:hover,.nav a.on{opacity:1}
.top-actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;transition:background .2s}
.icon-btn:hover{background:rgba(20,20,19,.06)}
.icon-btn svg{width:21px;height:21px}
.bot-btn{display:none;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.bot-btn svg{width:15px;height:15px}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.badge:empty{display:none}

/* marquee */
.marquee{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.marquee-track{display:inline-flex;gap:40px;padding:9px 0;animation:mq 38s linear infinite}
.marquee-track span::before{content:"✦";margin-right:40px;opacity:.5}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none}}

/* tab bar (mini-app) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--tabbar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(251,250,247,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab .badge{top:6px;right:calc(50% - 22px)}

main{min-height:70vh;padding-bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom))}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--gut)}

/* typography */
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.h1{font-size:clamp(38px,9vw,92px);line-height:.95;font-weight:800;letter-spacing:-.035em}
.h2{font-size:clamp(24px,4.6vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.025em}
.serif{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:0}
.lead{font-size:16px;color:var(--ink-2);max-width:46ch}
.sec{padding:36px 0 8px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.link{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:2px;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 24px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:transform .15s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-light{background:var(--surface);color:var(--ink)}
.btn-line{border:1.5px solid currentColor}
.btn-block{width:100%}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn svg{width:18px;height:18px}

/* media placeholder */
.media{position:relative;overflow:hidden;background:var(--card);border-radius:var(--r)}
.media>svg,.media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ratio-34{aspect-ratio:3/4}
.ratio-45{aspect-ratio:4/5}

/* hero */
.hero{display:grid;gap:18px;padding:18px 0 8px}
.hero-media{display:block;position:relative;overflow:hidden;aspect-ratio:4/5;border-radius:22px;background:var(--card)}
.hero-media>.media{position:absolute;inset:0;border-radius:0}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.35));z-index:1}
.hero-copy{display:flex;flex-direction:column;gap:16px;justify-content:flex-end}
.hero-copy .btns{display:flex;gap:10px;flex-wrap:wrap}
.hero-tag{position:absolute;left:16px;bottom:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;color:#fff;z-index:2;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.hero-tag b{font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.hero-tag span{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px var(--gut);margin:0 calc(var(--gut)*-1)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;transition:all .2s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 var(--gut);margin:0 calc(var(--gut)*-1)}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left}
.card .media{aspect-ratio:3/4}
.card-fav{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(251,250,247,.82);display:grid;place-items:center;backdrop-filter:blur(6px)}
.card-fav svg{width:18px;height:18px}
.card-fav.on svg{fill:var(--accent);stroke:var(--accent)}
.card-badge{position:absolute;top:10px;left:10px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:var(--surface);padding:5px 8px;border-radius:6px}
.card-name{font-size:14px;font-weight:600;line-height:1.3}
.card-meta{font-size:12px;color:var(--muted);margin-top:2px}
.price{font-weight:800;font-size:15px;letter-spacing:-.01em}
.card-quick{position:absolute;right:8px;bottom:8px;z-index:3;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;opacity:.92}
.card-quick svg{width:18px;height:18px}

/* looks teaser */
.looks-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.look-tile{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;display:block}
.look-tile .media{position:absolute;inset:0;border-radius:0}
.look-tile .cap{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.look-tile .cap small{font-size:10px;letter-spacing:.18em;font-weight:700;text-transform:uppercase;opacity:.9}
.look-tile .cap div{font-family:var(--serif);font-style:italic;font-size:clamp(19px,5.4vw,28px);line-height:1.05;overflow-wrap:anywhere}
.look-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.42));z-index:1}

/* perks */
.perks{display:grid;gap:10px}
.perk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:flex-start}
.perk svg{flex:none;width:26px;height:26px}
.perk b{display:block;font-size:14px;margin-bottom:3px}
.perk p{font-size:13px;color:var(--muted)}

/* catalog */
.cat-head{padding:22px 0 10px;display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:99px;background:var(--surface);border:1px solid var(--line);padding:0 16px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;width:100%;font-size:15px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 16px;font-size:13px;color:var(--muted)}
.tool-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px}
.tool-btn svg{width:16px;height:16px}
.tool-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.empty{padding:60px 0;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty svg{width:44px;height:44px;opacity:.5}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(18,18,17,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;color:var(--ink);max-height:92vh;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet{visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet-grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;flex:none}
.sheet-head h3{font-size:17px;font-weight:800}
.sheet-body{overflow-y:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* product sheet */
.gal{position:relative;margin:0 -18px}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-slide{flex:0 0 100%;scroll-snap-align:center;padding:0 18px}
.gal-slide .media{aspect-ratio:4/5}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:all .25s}
.dots i.on{background:var(--ink);width:18px}
.p-title{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:18px}
.p-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.p-row .price{font-size:21px}
.p-art{font-size:12px;color:var(--muted)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:20px 0 10px;display:flex;justify-content:space-between}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:52px;height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;transition:all .15s}
.size.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.p-actions{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:-22px;background:linear-gradient(transparent,var(--surface) 30%);padding:16px 0 4px}
.p-actions .btn-fav{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.p-actions .btn-fav svg{width:22px;height:22px}
.p-actions .btn-fav.on svg{fill:var(--accent);stroke:var(--accent)}
.acc{border-top:1px solid var(--line);margin-top:20px}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:700;font-size:14px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:20px;font-weight:400;transition:transform .2s}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc .acc-c{padding:0 0 16px;font-size:14px;color:var(--ink-2)}
.acc .acc-c p+p{margin-top:8px}
.mini-looks{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.mini-looks a{flex:0 0 110px}
.mini-looks .media{aspect-ratio:3/4;border-radius:10px}
.mini-looks small{display:block;font-size:12px;margin-top:6px;font-weight:600}

/* filter sheet */
.range{display:flex;gap:10px}
.range input{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;min-width:0}
.select{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.sheet-foot{display:flex;gap:10px;margin-top:24px}

/* cart */
.page-title{padding:26px 0 18px}
.cart-list{display:flex;flex-direction:column;gap:14px}
.ci{display:grid;grid-template-columns:84px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.ci .media{aspect-ratio:3/4;border-radius:10px}
.ci-top{display:flex;justify-content:space-between;gap:8px}
.ci-name{font-weight:700;font-size:14px;line-height:1.3}
.ci-meta{font-size:12px;color:var(--muted);margin-top:3px}
.ci-bot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:99px;height:36px}
.qty button{width:34px;height:34px;font-size:18px;font-weight:600}
.qty span{min-width:22px;text-align:center;font-weight:700;font-size:14px}
.ci-del{width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.ci-del svg{width:18px;height:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.box h4{font-size:15px;font-weight:800;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.opt:first-of-type{border-top:0;padding-top:2px}
.opt input{margin-top:3px;accent-color:var(--ink);width:18px;height:18px;flex:none}
.opt b{font-size:14px;display:block}
.opt small{font-size:12px;color:var(--muted)}
.opt .op{margin-left:auto;font-weight:700;font-size:14px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.field input,.field textarea{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;outline:none;transition:border .2s}
.field textarea{height:84px;padding:12px 14px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field.err input{border-color:var(--accent)}
.promo{display:flex;gap:8px}
.promo input{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;min-width:0;text-transform:uppercase}
.promo button{height:46px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px}
.sum{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:19px;font-weight:800;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.progress{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:9px}
.order-box{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;max-height:260px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* info */
.info-grid{display:grid;gap:12px}
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.info-card h4{font-size:16px;font-weight:800;margin-bottom:10px}
.info-card p,.info-card li{font-size:14px;color:var(--ink-2)}
.info-card ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.info-card li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.info-card li:last-child{border:0;padding:0}
.info-card li span:last-child{font-weight:700;white-space:nowrap}

/* lookbook (dark) */
body.lb{background:var(--dark);color:#f1eee8}
body.lb .top{background:rgba(18,18,17,.82);border-color:var(--dark-line)}
body.lb .icon-btn:hover{background:rgba(255,255,255,.08)}
body.lb .bot-btn{background:#f1eee8;color:var(--dark)}
body.lb .tabbar{background:rgba(22,22,21,.94);border-color:var(--dark-line)}
body.lb .tab{color:var(--dark-muted)}
body.lb .tab.on{color:#f1eee8}
.lb-cover{min-height:calc(100svh - 56px - var(--tabbar));display:flex;flex-direction:column;justify-content:flex-end;padding:40px 0 30px;position:relative}
.lb-cover .kicker{color:var(--dark-muted)}
.lb-cover .h1{font-size:clamp(54px,16vw,190px);letter-spacing:-.05em}
.lb-cover .serif{font-size:clamp(30px,6vw,64px);display:block;margin-top:6px;color:#d9cfbf}
.lb-cover .lead{color:#bdb7ad;margin-top:20px}
.lb-cover .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.lb-index{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:30px}
.lb-index a{flex:none;font-size:12px;font-weight:700;letter-spacing:.12em;border:1px solid var(--dark-line);border-radius:99px;padding:8px 14px;color:#cfc9bf}
.look{display:grid;gap:20px;padding:34px 0;border-top:1px solid var(--dark-line);scroll-margin-top:60px}
.look-media{border-radius:20px;aspect-ratio:4/5}
.look-num{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--dark-muted);text-transform:uppercase}
.look-title{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(40px,7vw,76px);line-height:.95;margin:10px 0 14px;color:#f4efe6}
.look-text{color:#bdb7ad;max-width:44ch}
.look-items{margin-top:22px;border-top:1px solid var(--dark-line)}
.li{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--dark-line);text-align:left;width:100%}
.li .media{aspect-ratio:3/4;border-radius:8px;background:var(--dark-2)}
.li b{font-size:14px;font-weight:600;display:block}
.li small{font-size:12px;color:var(--dark-muted)}
.li .price{font-size:14px}
.look-total{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:14px;flex-wrap:wrap}
.look-total span{font-size:13px;color:var(--dark-muted)}
.look-total b{display:block;font-size:22px;color:#f4efe6}
.lb-end{padding:60px 0 30px;text-align:center;border-top:1px solid var(--dark-line);display:flex;flex-direction:column;align-items:center;gap:16px}
.lb-end .h2{max-width:16ch}

/* look builder rows */
.lbuild{display:flex;flex-direction:column;gap:14px}
.lbr{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:start}
.lbr .media{aspect-ratio:3/4;border-radius:8px}
.lbr .sizes{margin-top:8px}
.lbr .size{min-width:44px;height:36px;font-size:13px;border-radius:10px}
.lbr label.skip{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}

/* presentation */
.pres{position:fixed;inset:0;z-index:80;background:#0d0d0c;color:#f1eee8;display:none}
.pres.show{display:block}
.pres-slide{position:absolute;inset:0;display:grid;opacity:0;pointer-events:none;transition:opacity .5s}
.pres-slide.on{opacity:1;pointer-events:auto}
.ps-split{grid-template-columns:1fr}
.ps-media{position:relative;overflow:hidden}
.ps-media .media{position:absolute;inset:0;border-radius:0}
.ps-copy{position:absolute;left:0;right:0;bottom:0;padding:28px 22px 86px;background:linear-gradient(rgba(13,13,12,0),rgba(13,13,12,.94) 24%);z-index:2}
.ps-copy .kicker{color:#a9a399}
.ps-copy h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(44px,9vw,110px);line-height:.92;margin:8px 0 12px}
.ps-copy p{color:#c9c3b9;max-width:46ch;font-size:15px}
.ps-items{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:#e8e2d8}
.ps-items span b{font-weight:800}
.ps-center{place-items:center;text-align:center;padding:30px}
.ps-center .h1{font-size:clamp(60px,15vw,200px);letter-spacing:-.05em}
.ps-feat{display:grid;gap:12px;max-width:980px;width:100%;text-align:left;margin-top:30px}
.ps-feat div{border:1px solid #2c2b28;border-radius:16px;padding:18px}
.ps-feat b{display:block;font-size:16px;margin-bottom:4px}
.ps-feat p{font-size:13px;color:#a9a399}
.pres-ui{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 18px calc(16px + env(safe-area-inset-bottom))}
.pres-ui .ctr{font-size:12px;letter-spacing:.2em;font-weight:700;color:#f1eee8;background:rgba(13,13,12,.6);border:1px solid #3a3935;border-radius:99px;padding:9px 14px}
.pres-ui .nb{display:flex;gap:8px}
.pres-ui button{width:46px;height:46px;border-radius:50%;border:1px solid #3a3935;display:grid;place-items:center;background:rgba(13,13,12,.5)}
.pres-ui svg{width:20px;height:20px}
.pres-close{position:absolute;top:14px;right:14px;z-index:6;width:44px;height:44px;border-radius:50%;background:rgba(13,13,12,.55);border:1px solid #3a3935;display:grid;place-items:center}
.pres-close svg{width:20px;height:20px}
.pres-bar{position:absolute;top:0;left:0;height:3px;background:#f1eee8;z-index:6;transition:width .4s}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.lb .toast{background:#f1eee8;color:var(--dark)}

/* footer */
.foot{border-top:1px solid var(--line);margin-top:50px;padding:30px 0 10px;display:grid;gap:22px;font-size:13px;color:var(--muted)}
.foot .logo{color:var(--ink)}
.foot a{color:var(--ink);font-weight:600}
body.lb .foot{border-color:var(--dark-line)}
body.lb .foot .logo,body.lb .foot a{color:#f1eee8}

/* внутри telegram */
html.tg .bot-btn{display:none!important}
html.tg .top-in{height:50px}

/* desktop */
@media (min-width:700px){
  :root{--gut:28px}
  .grid{grid-template-columns:repeat(3,1fr);gap:30px 18px}
  .rail{grid-auto-columns:30%}
  .looks-grid{grid-template-columns:repeat(3,1fr)}
  .perks{grid-template-columns:repeat(3,1fr)}
  .info-grid{grid-template-columns:repeat(2,1fr)}
  .ps-feat{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:980px){
  .nav{display:flex}
  .bot-btn{display:inline-flex}
  .tabbar{display:none}
  main{padding-bottom:40px}
  .toast{bottom:28px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .rail{grid-auto-columns:23%}
  .hero{grid-template-columns:1.15fr .85fr;gap:40px;padding:28px 0 10px;min-height:calc(100vh - 100px)}
  .hero-media{aspect-ratio:auto;min-height:620px}
  .hero-copy{padding-bottom:30px}
  .sheet{left:50%;right:auto;bottom:50%;width:min(980px,92vw);max-height:88vh;border-radius:24px;transform:translate(-50%,calc(50% + 40px));opacity:0;pointer-events:none;transition:transform .3s,opacity .25s}
  .sheet.show{transform:translate(-50%,50%);opacity:1;pointer-events:auto}
  .sheet.narrow{width:min(520px,92vw)}
  .sheet-grab{display:none}
  .sheet-body{padding:6px 26px 26px}
  .p-wrap{display:grid;grid-template-columns:1fr 1fr;gap:30px}
  .p-wrap .gal{margin:0}
  .p-wrap .gal-slide{padding:0}
  .p-wrap .p-title{margin-top:0}
  .p-actions{position:static;padding:0;background:none}
  .look{grid-template-columns:1.1fr .9fr;gap:50px;padding:60px 0;align-items:start}
  .look:nth-of-type(even) .look-media{order:2}
  .look-media{position:sticky;top:76px}
  .look-copy{padding-top:20px}
  .cart-layout{display:grid;grid-template-columns:1fr 400px;gap:28px;align-items:start}
  .cart-layout .side{position:sticky;top:76px}
  .cart-layout .side .box:first-child{margin-top:0}
  .ps-split{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
  .ps-copy h2{font-size:clamp(44px,5.4vw,96px);overflow-wrap:anywhere}
  .ps-copy{position:static;background:none;display:flex;flex-direction:column;justify-content:center;padding:60px 56px 100px}
  .foot{grid-template-columns:2fr 1fr 1fr 1fr}
}
</style>

function lum(hex){ const n=parseInt(hex.slice(1),16); const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255; return .2126*r+.7152*g+.0722*b; }
function shade(hex,k){ const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(v*k))); return '#'+[f(n>>16),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join(''); }
let phUid=0;
function productPH(p,i=0){
  const tone = p.tone||'#d9d2c5', dark = lum(tone)<.42, uid='g'+(phUid++);
  const ink = dark?'255,255,255':'20,20,19';
  const logo = dark?'#cw-w':'#cw-b';
  const v = i%3;
  let mid='';
  if(v===0){
    mid = `<use href="${logo}" x="85" y="176" width="130" height="25" opacity=".88"/>
      <path d="M138 218H162" stroke="rgba(${ink},.35)" stroke-width="1"/>
      <text x="150" y="240" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.4" fill="rgba(${ink},.55)">${esc(catName(p.cat).toUpperCase())}</text>`;
  } else if(v===1){
    mid = `<text x="150" y="214" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="40" fill="rgba(${ink},.78)">${esc(p.color)}</text>
      <text x="150" y="246" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.4" fill="rgba(${ink},.5)">ЦВЕТ</text>`;
  } else {
    mid = `<text x="150" y="222" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="2" fill="rgba(${ink},.14)">${esc(p.id.toUpperCase())}</text>
      <use href="${logo}" x="112" y="246" width="76" height="15" opacity=".6"/>`;
  }
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
    <linearGradient id="${uid}" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="${shade(tone,1.07)}"/><stop offset="1" stop-color="${shade(tone,.9)}"/></linearGradient>
    <radialGradient id="${uid}v" cx=".5" cy=".42" r=".75"><stop offset=".55" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,${dark?.28:.1})"/></radialGradient>
    <pattern id="${uid}t" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V4" stroke="rgba(${ink},.045)" stroke-width="1"/></pattern></defs>
    <rect width="300" height="400" fill="url(#${uid})"/><rect width="300" height="400" fill="url(#${uid}t)"/><rect width="300" height="400" fill="url(#${uid}v)"/>
    <rect x="14" y="14" width="272" height="372" fill="none" stroke="rgba(${ink},.14)" stroke-width="1"/>${mid}</svg>`;
}
function pMedia(p,i=0,cls=''){
  const src = p.img && p.img[i];
  const ph = productPH(p,i);
  return `<div class="media ${cls}" data-ph="${esc(ph)}">${src?`<img src="${esc(src)}" alt="${esc(p.name)}" loading="lazy" onerror="this.outerHTML=this.parentNode.dataset.ph">`:ph}</div>`;
}
function lookPH(l){
  const n = String(LOOKS.indexOf(l)+1).padStart(2,'0');
  const dark = lum(l.tone)<.33, uid='lg'+(phUid++);
  const ink = dark?'255,255,255':'20,20,19';
  return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${uid}" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="${shade(l.tone,1.07)}"/><stop offset=".62" stop-color="${shade(l.tone,.98)}"/><stop offset="1" stop-color="${shade(l.tone,.84)}"/></linearGradient><radialGradient id="${uid}s" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="rgba(${ink},.16)"/><stop offset="1" stop-color="rgba(${ink},0)"/></radialGradient></defs>
  <rect width="400" height="500" fill="url(#${uid})"/>
  <path d="M0 352Q200 322 400 352" fill="none" stroke="rgba(${ink},.14)" stroke-width="1"/>
  <ellipse cx="200" cy="372" rx="120" ry="16" fill="url(#${uid}s)"/>
  <rect x="18" y="18" width="364" height="464" fill="none" stroke="rgba(${ink},.2)" stroke-width="1"/>
  <text x="200" y="262" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="190" fill="rgba(${ink},.16)">${n}</text>
  <text x="200" y="58" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="3.5" fill="rgba(${ink},.42)">ФОТО ОБРАЗА · 4:5</text></svg>`;
}
function lookMedia(l,cls=''){
  const ph = lookPH(l);
  return `<div class="media ${cls}" data-ph="${esc(ph)}">${l.img?`<img src="${esc(l.img)}" alt="${esc(l.title)}" loading="lazy" onerror="this.outerHTML=this.parentNode.dataset.ph">`:ph}</div>`;
}
function galleryCount(p){ return Math.max(3,(p.img||[]).length); }

/* карточка товара */
function card(p){
  const on = state.fav.has(p.id);
  return `<article class="card">
    <button class="card-open" data-act="open" data-id="${p.id}" aria-label="${esc(p.name)}" style="text-align:left;display:flex;flex-direction:column;gap:10px">
      ${pMedia(p,0)}
      <div><div class="card-name">${esc(p.name)}</div><div class="card-meta">${esc(p.color)} · ${p.sizes.length>1?esc(p.sizes[0]+'-'+p.sizes[p.sizes.length-1]):esc(p.sizes[0])}</div></div>
      <div class="price">${fmt(p.price)}</div>
    </button>
    ${p.badge?`<span class="card-badge">${p.badge==='new'?'Новинка':'Хит'}</span>`:''}
    <button class="card-fav ${on?'on':''}" data-act="fav" data-id="${p.id}" aria-label="${on?'Убрать из избранного':'В избранное'}" aria-pressed="${on}">${I.heart}</button>
  </article>`;
}

function filtered(){
  const f = state.filter, q = f.q.trim().toLowerCase();
  let list = PRODUCTS.filter(p=>(f.cat==='all'||p.cat===f.cat)
    && (!q || (p.name+' '+p.color+' '+catName(p.cat)).toLowerCase().includes(q))
    && (!f.sizes.size || p.sizes.some(s=>f.sizes.has(s)))
    && (f.min===''||p.price>=+f.min) && (f.max===''||p.price<=+f.max));
  if(f.sort==='asc') list.sort((a,b)=>a.price-b.price);
  else if(f.sort==='desc') list.sort((a,b)=>b.price-a.price);
  else list.sort((a,b)=>(b.badge==='new')-(a.badge==='new'));
  return list;
}
function filterActive(){ const f=state.filter; return f.sizes.size||f.min!==''||f.max!==''||f.sort!=='new'; }

function totals(){
  const sub = state.cart.reduce((s,c)=>s+byId[c.id].price*c.qty,0);
  const disc = state.promoApplied ? Math.round(sub*SETTINGS.promo.percent/100) : 0;
  const d = SETTINGS.delivery.find(x=>x.id===state.delivery);
  const free = SETTINGS.freeDeliveryFrom && (sub-disc)>=SETTINGS.freeDeliveryFrom;
  const ship = free?0:(d?d.price:0);
  return { sub, disc, ship, free, total: sub-disc+ship, d };
}

/* sheets */
function openSheet(title,html,narrow=false){
  $('#sheetTitle').textContent=title; $('#sheetBody').innerHTML=html; $('#sheetBody').scrollTop=0;
  $('#sheet').classList.toggle('narrow',narrow);
  $('#sheet').classList.add('show'); $('#scrim').classList.add('show');
  document.body.style.overflow='hidden';
  setTimeout(()=>{ const f=$('#sheet [data-autofocus]')||$('#sheet .icon-btn'); f&&f.focus({preventScroll:true}); },60);
}
function closeSheet(){
  $('#sheet').classList.remove('show'); $('#scrim').classList.remove('show');
  document.body.style.overflow=''; state.sheet=null;
}

function updateLookBtn(){
  const s=state.sheet; if(!s||s.type!=='look') return;
  const on = Object.entries(s.picks).filter(([,v])=>v.on);
  const missing = on.filter(([,v])=>!v.size).length;
  const sum = on.reduce((a,[id])=>a+byId[id].price,0);
  const b=$('#lookAdd'); if(!b) return;
  b.disabled = !on.length || missing>0;
  b.textContent = !on.length ? 'Выберите хотя бы одну вещь' : missing ? `Выберите размер (${missing})` : `Добавить ${on.length} шт. · ${fmt(sum)}`;
}

/* корзина */
function addToCart(id,size,qty=1){
  const ex = state.cart.find(c=>c.id===id&&c.size===size);
  if(ex) ex.qty+=qty; else state.cart.push({id,size,qty});
  badges();
}
function badges(){
  setTimeout(()=>typeof tgSync==='function'&&tgSync(),0);
  const n = state.cart.reduce((s,c)=>s+c.qty,0);
  $$('[data-badge="cart"]').forEach(b=>b.textContent=n||'');
  $$('[data-badge="fav"]').forEach(b=>b.textContent=state.fav.size||'');
}
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

function orderText(num){
  const t=totals(), c=state.checkout;
  const lines = state.cart.map((ci,i)=>{const p=byId[ci.id];return `${i+1}. ${p.name} (${p.id.toUpperCase()}), размер ${ci.size}, ${ci.qty} шт., ${fmt(p.price*ci.qty)}`;});
  return [`Заказ ${num}, ${SETTINGS.shopName}`, '', ...lines, '',
    `Товары: ${fmt(t.sub)}`, t.disc?`Скидка (${SETTINGS.promo.code}): -${fmt(t.disc)}`:null,
    `Доставка: ${t.d?t.d.name:''}${t.free?', бесплатно':(t.ship?', '+(t.d.from?'от ':'')+fmt(t.ship):'')}`,
    `Итого: ${fmt(t.total)}`, '',
    `Имя: ${c.name}`, `Контакт: ${c.phone}`, state.delivery!=='pickup'?`Адрес: ${c.address}`:'Самовывоз из шоурума',
    c.comment?`Комментарий: ${c.comment}`:null
  ].filter(x=>x!==null).join('\n');
}
function checkout(){
  const c=state.checkout; let ok=true;
  const need = ['name','phone'].concat(state.delivery!=='pickup'?['address']:[]);
  need.forEach(k=>{ const el=$('#f-'+k); const bad=!String(c[k]).trim(); if(el) el.classList.toggle('err',bad); if(bad) ok=false; });
  if(!ok){ toast('Заполните контакты'); const f=$('.field.err input'); f&&f.focus(); return; }
  const num = 'CR-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+String(Math.floor(Math.random()*9000)+1000);
  const text = orderText(num);
  state.lastOrder = text;
  openSheet('Заказ '+num, `<p style="font-size:14px;color:var(--ink-2);margin-bottom:14px">Почти готово. Отправьте заказ менеджеру, он подтвердит наличие, размер и время доставки. Текст заказа уже скопирован.</p>
    <div class="order-box">${esc(text)}</div>
    <div class="sheet-foot" style="flex-wrap:wrap"><button class="btn btn-line" style="flex:1" data-act="copy">${I.copy}Скопировать</button><button class="btn btn-dark" style="flex:1.4" data-act="send" data-autofocus>${I.tg}Отправить в Telegram</button></div>
    <p class="note" style="text-align:center">Откроется чат с менеджером. Текст заказа уже будет в поле ввода, если нет, просто вставьте его.</p>`, true);
  copy(text,true);
}
function copy(text,silent){
  const done=()=>{ if(!silent) toast('Скопировано'); };
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done)); }
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){} ta.remove(); }
function sendOrder(){
  copy(state.lastOrder||'',true);
  const link = SETTINGS.botUrl + '?text=' + encodeURIComponent(state.lastOrder||'');
  haptic('ok');
  if(TG && TG.openTelegramLink) TG.openTelegramLink(link); else window.open(link,'_blank','noopener');
  state.cart=[]; state.promoApplied=false; badges(); closeSheet(); render(); toast('Заказ передан, отправьте его в чате');
}

/* презентация лукбука */
let pIdx=0, pSlides=[];
function buildPres(){
  const s=[];
  s.push(`<div class="pres-slide ps-center"><div><div class="kicker" style="color:#a9a399">${esc(SETTINGS.shopName)} · новая версия магазина</div><h1 class="h1" style="margin:14px 0">CORNERY</h1><div class="serif" style="font-size:clamp(28px,5vw,56px);color:#d9cfbf">Лукбук · ${esc(SETTINGS.season)}</div></div></div>`);
  LOOKS.forEach((l,i)=>{ const items=l.items.map(id=>byId[id]).filter(Boolean);
    s.push(`<div class="pres-slide ps-split"><div class="ps-media">${lookMedia(l)}</div><div class="ps-copy"><div class="kicker">Look ${String(i+1).padStart(2,'0')} / ${String(LOOKS.length).padStart(2,'0')}</div><h2>${esc(l.title)}</h2><p>${esc(l.text)}</p><div class="ps-items">${items.map(p=>`<span>${esc(p.name)} · <b>${fmt(p.price)}</b></span>`).join('')}</div></div></div>`); });
  s.push(`<div class="pres-slide ps-center"><div style="width:100%;max-width:980px"><div class="kicker" style="color:#a9a399">Что нового</div><h2 class="h2" style="margin-top:10px">Магазин, который удобно листать</h2><div class="ps-feat">
    <div><b>Каталог с фильтрами</b><p>Категории, размеры, цена и поиск. Нужная вещь за пару касаний.</p></div>
    <div><b>Образы целиком</b><p>Лукбук связан с каталогом: образ добавляется в корзину одной кнопкой.</p></div>
    <div><b>Заказ в Telegram</b><p>Корзина формирует готовый заказ и отправляет его менеджеру.</p></div>
    <div><b>Работает везде</b><p>Один и тот же сайт работает в браузере и как мини-приложение в Telegram.</p></div></div></div></div>`);
  s.push(`<div class="pres-slide ps-center"><div><h1 class="h1" style="font-size:clamp(48px,11vw,150px)">CORNERY</h1><p style="color:#c9c3b9;margin-top:16px">${esc(SETTINGS.address)} · ${esc(SETTINGS.hours)}</p></div></div>`);
  return s;
}
function openPres(at=0){
  pSlides = buildPres();
  const el=$('#pres');
  el.innerHTML = `<div class="pres-bar" id="pBar"></div><button class="pres-close" data-act="pres-close" aria-label="Закрыть презентацию">${I.close}</button>${pSlides.join('')}
    <div class="pres-ui"><span class="ctr" id="pCtr"></span><div class="nb"><button data-act="pres-fs" aria-label="На весь экран">${I.expand}</button><button data-act="pres-prev" aria-label="Назад">${I.arrowL}</button><button data-act="pres-next" aria-label="Вперёд">${I.arrowR}</button></div></div>`;
  el.classList.add('show'); document.body.style.overflow='hidden'; pGo(at); tgSync();
}
function pGo(i){
  pIdx = Math.max(0,Math.min(pSlides.length-1,i));
  $$('#pres .pres-slide').forEach((s,k)=>s.classList.toggle('on',k===pIdx));
  $('#pCtr').textContent = String(pIdx+1).padStart(2,'0')+' / '+String(pSlides.length).padStart(2,'0');
  $('#pBar').style.width = ((pIdx+1)/pSlides.length*100)+'%';
}
function closePres(){ $('#pres').classList.remove('show'); document.body.style.overflow=''; setTimeout(tgSync,0); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }

/* роутер */
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'') || 'home';
  const [path,qs] = h.split('?'); const params = new URLSearchParams(qs||'');
  return { path: path||'home', params };
}
let pendingAnchor=null;
function render(keep){
  const y = window.scrollY;
  const { path, params } = parseHash();
  const views = { home:viewHome, catalog:viewCatalog, lookbook:viewLookbook, fav:viewFav, cart:viewCart, info:viewInfo };
  const v = views[path] ? path : 'home';
  if(v==='catalog' && params.get('cat')) state.filter.cat = params.get('cat');
  document.body.classList.toggle('lb', v==='lookbook');
  $('#app').innerHTML = views[v]();
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===v));
  badges();
  if(v==='catalog'){ const q=$('#q'); q.addEventListener('input',()=>{state.filter.q=q.value; $('#catResults').innerHTML=catalogResults();}); if(params.get('focus')) setTimeout(()=>q.focus(),50); }
  if(pendingAnchor){ const t=document.getElementById(pendingAnchor); pendingAnchor=null; if(t) setTimeout(()=>t.scrollIntoView({behavior:'smooth'}),40); else window.scrollTo(0,0); }
  else window.scrollTo(0, keep ? y : 0);
}
window.addEventListener('hashchange',()=>{ closeSheet(); render(); if(typeof tgSync==='function') tgSync(); });

/* события */
document.addEventListener('click',e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case 'go': {
      e.preventDefault(); if(el.dataset.anchor) pendingAnchor = el.dataset.anchor;
      const to = el.dataset.to; closeSheet();
      if(location.hash===to) render(); else location.hash = to; break; }
    case 'anchor': { e.preventDefault(); const t=document.getElementById(el.dataset.anchor); t&&t.scrollIntoView({behavior:'smooth'}); break; }
    case 'open': e.preventDefault(); productSheet(id); break;
    case 'fav': {
      e.preventDefault(); e.stopPropagation();
      if(state.fav.has(id)){ state.fav.delete(id); toast('Удалено из избранного'); } else { state.fav.add(id); toast('Добавлено в избранное'); }
      $$(`[data-act="fav"][data-id="${id}"]`).forEach(b=>{ const on=state.fav.has(id); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
      badges(); if(parseHash().path==='fav' && !state.sheet) render(true); break; }
    case 'size': {
      state.sheet.size = el.dataset.s; haptic('select');
      $$('#pSizes .size').forEach(b=>{ const on=b.dataset.s===state.sheet.size; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
      $('#addBtn').textContent='Добавить в корзину'; break; }
    case 'add': {
      const s=state.sheet; if(!s) break;
      if(!s.size){ toast('Сначала выберите размер'); $('#pSizes').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260}); break; }
      addToCart(s.id,s.size); haptic('ok'); toast('Добавлено в корзину'); closeSheet(); if(parseHash().path==='cart') render(true); break; }
    case 'cat': state.filter.cat=id; $$('#catChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); $('#catResults').innerHTML=catalogResults(); history.replaceState(null,'','#/catalog'+(id!=='all'?'?cat='+id:'')); break;
    case 'filters': filterSheet(); break;
    case 'fsize': { const s=el.dataset.s, set=state.filter.sizes; set.has(s)?set.delete(s):set.add(s); el.classList.toggle('on',set.has(s)); el.setAttribute('aria-pressed',set.has(s)); break; }
    case 'apply-filters': state.filter.sort=$('#fSort').value; state.filter.min=$('#fMin').value; state.filter.max=$('#fMax').value; closeSheet(); $('#catResults')&&($('#catResults').innerHTML=catalogResults()); break;
    case 'reset-filters': Object.assign(state.filter,{q:'',sizes:new Set(),sort:'new',min:'',max:''}); closeSheet(); if(parseHash().path==='catalog') render(); break;
    case 'qty': { const c=state.cart[+el.dataset.i]; c.qty+= +el.dataset.d; if(c.qty<1) state.cart.splice(+el.dataset.i,1); badges(); render(true); break; }
    case 'rm': state.cart.splice(+el.dataset.i,1); badges(); render(true); toast('Удалено из корзины'); break;
    case 'dl': state.delivery=el.value; render(true); break;
    case 'promo': {
      if(state.promoApplied) break;
      const v=($('#promo').value||'').trim().toUpperCase();
      if(v===SETTINGS.promo.code.toUpperCase()){ state.promoApplied=true; render(true); toast('Промокод применён'); } else toast('Промокод не найден'); break; }
    case 'checkout': checkout(); break;
    case 'copy': copy(state.lastOrder||''); break;
    case 'send': sendOrder(); break;
    case 'look': lookSheet(id); break;
    case 'lsize': { const p=state.sheet.picks[el.dataset.pid]; p.size=el.dataset.s; $$(`.lbr[data-pid="${el.dataset.pid}"] .size`).forEach(b=>b.classList.toggle('on',b.dataset.s===p.size)); updateLookBtn(); break; }
    case 'lskip': { state.sheet.picks[el.dataset.pid].on = !el.checked; $(`.lbr[data-pid="${el.dataset.pid}"]`).style.opacity = el.checked?.4:1; updateLookBtn(); break; }
    case 'look-add': { const on=Object.entries(state.sheet.picks).filter(([,v])=>v.on&&v.size); on.forEach(([pid,v])=>addToCart(pid,v.size)); haptic('ok'); closeSheet(); toast(`Образ добавлен: ${on.length} шт.`); break; }
    case 'close-sheet': closeSheet(); break;
    case 'present': openPres(0); break;
    case 'pres-next': pGo(pIdx+1); break;
    case 'pres-prev': pGo(pIdx-1); break;
    case 'pres-close': closePres(); break;
    case 'pres-fs': { const p=$('#pres'); if(!document.fullscreenElement && p.requestFullscreen) p.requestFullscreen().catch(()=>{}); else if(document.exitFullscreen) document.exitFullscreen().catch(()=>{}); break; }
  }
});
document.addEventListener('input',e=>{ const k=e.target.dataset&&e.target.dataset.ck; if(k){ state.checkout[k]=e.target.value; const f=e.target.closest('.field'); f&&f.classList.remove('err'); } });
document.addEventListener('keydown',e=>{
  if($('#pres').classList.contains('show')){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); pGo(pIdx+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); pGo(pIdx-1); }
    else if(e.key==='Escape') closePres();
    return;
  }
  if(e.key==='Escape' && $('#sheet').classList.contains('show')) closeSheet();
});
// свайп в презентации
(()=>{ let x0=null; const p=$('#pres');
  p.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  p.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) pGo(pIdx+(dx<0?1:-1)); x0=null; },{passive:true});
})();

/* старт */
document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="cw-w" viewBox="0 0 494 96"><image href="${LOGO_W}" width="494" height="96"/></symbol><symbol id="cw-b" viewBox="0 0 494 96"><image href="${LOGO_B}" width="494" height="96"/></symbol></defs></svg>`);
$('#mq').innerHTML = [...SETTINGS.marquee,...SETTINGS.marquee].map(t=>`<span>${esc(t)}</span>`).join('');
$('#botTop').href = SETTINGS.botUrl;
/* telegram mini app */
let TG = null;
function tgInit(){
  const w = window.Telegram && Telegram.WebApp;
  if(!w || !w.initData || TG) return;          // открыт не в Telegram
  TG = w;
  document.documentElement.classList.add('tg');
  try{ TG.ready(); TG.expand(); }catch(e){}
  try{ if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }catch(e){}
  try{ TG.BackButton.onClick(tgBack); }catch(e){}
  tgSync();
}
function tgColors(){
  if(!TG) return;
  const dark = document.body.classList.contains('lb') || $('#pres').classList.contains('show');
  const c = dark ? '#121211' : '#f3f0ea';
  try{ TG.setHeaderColor(c); TG.setBackgroundColor(c); if(TG.setBottomBarColor) TG.setBottomBarColor(dark?'#161615':'#fbfaf7'); }catch(e){}
}
function tgSync(){
  if(!TG) return;
  const deep = parseHash().path!=='home' || $('#sheet').classList.contains('show') || $('#pres').classList.contains('show');
  try{ deep ? TG.BackButton.show() : TG.BackButton.hide(); }catch(e){}
  try{ state.cart.length ? TG.enableClosingConfirmation() : TG.disableClosingConfirmation(); }catch(e){}
  tgColors();
}
function tgBack(){
  if($('#pres').classList.contains('show')) closePres();
  else if($('#sheet').classList.contains('show')) closeSheet();
  else if(history.length>1) history.back();
  else location.hash='#/home';
  setTimeout(tgSync,60);
}
function haptic(kind){
  if(!TG||!TG.HapticFeedback) return;
  try{ kind==='select' ? TG.HapticFeedback.selectionChanged() : kind==='ok' ? TG.HapticFeedback.notificationOccurred('success') : TG.HapticFeedback.impactOccurred('light'); }catch(e){}
}
if(window.Telegram && Telegram.WebApp) tgInit();
else { const sj=document.getElementById('tgjs'); sj && sj.addEventListener('load',tgInit); }
// синхронизация кнопки «Назад» и цветов при любых изменениях
new MutationObserver(()=>tgSync()).observe(document.body,{subtree:false,attributes:true,attributeFilter:['class','style']});
render();
try{ console.log('%cCORNERY Mini App%c\n© 2026 '+__AUTHOR__+'. Все права защищены.','font:700 14px sans-serif;letter-spacing:.2em','font:12px sans-serif;color:#7a766e'); }catch(e){}
</script>
</body>
